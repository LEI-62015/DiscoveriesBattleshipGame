name: Auto Review Assignment

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  assign-reviewers:
    runs-on: ubuntu-latest

    steps:
      - name: Assign reviewers dynamically
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            const reviewers = pr.assignees.length > 0
              ? pr.assignees.map(assignee => assignee.login)
              : ["LEI-129334", "LEI-62015", "LEI-99917", "LEI105514"];

            if (reviewers.length === 0) {
              core.info("No reviewers to assign.");
              return;
            }

            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              reviewers
            });
